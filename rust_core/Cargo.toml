[package]
name = "poker_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "poker_core"
# cdylib: build a C-compatible dynamic library that Python can import.
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
